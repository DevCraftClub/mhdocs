  - awesome-nav
  - section-index
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      timezone: Europe/Berlin
  - autolinks
  - mermaid2
  - glightbox:
      touchNavigation: true
      loop: true
  - import-statement
  - meta-manager
  - git-authors:
      show_email_address: false
      show_contribution: true
      add_co_authors: true
      ignore_authors:
        - m.harder@bsg.de
  - htmlproofer
  - link-marker
  - neoteroi.mkdocsoad:
      use_pymdownx: true

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - markdown_version_annotations:
      version_added_title: "\\1: Добавлен новый функционал"
      version_changed_title: "\\1: Изменения в существующем функционале"
      version_removed_title: "\\1: Удаление функционала или очистка проекта"
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      use_pygments: true
      auto_title: true
  #    - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

extra:
  homepage: https://devcraft.club
  analytics:
    provider: google
    property: G-6B531VYCBD
  version:
    provider: mike
    default: latest
    alias: true
  generator: false
  social:
    - icon: fontawesome/solid/paper-plane
      link: https://t.me/maharder
      name: Telegram

  search_metadata_file: docs/search-metadata.yml
  search_synonyms: true
  search_categories: true
  search_weights: true

extra_javascript:
  - extras/js/search-metadata-loader.js
  - extras/js/search-enhancement.js

extra_css:
  - extras/css/all.min.css
  - extras/css/search-enhancement.css
  - extras/css/styles.css
  - extras/css/mkdocsoad.css
