name: Деплой документации

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование кода
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настройка Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Определение версии из manifest.json
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version // empty' manifest.json)
          if [[ -z "$VERSION" ]]; then
            echo "::warning::В manifest.json отсутствует корректное поле version, используется 'dev'"
            VERSION="dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "Используется версия: $VERSION"

      - name: Генерация ключа кеша
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - name: Кеш MkDocs Material
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}-${{ env.version }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Настройка Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libfreetype6-dev \
            libffi-dev \
            libjpeg-dev \
            libpng-dev \
            libz-dev

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-cache-dir -r requirements.txt
          pip install pillow cairosvg

      - name: Деплой с mike
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mike deploy --push --update-aliases "${{ env.version }}" latest --allow-empty
          mike set-default --push latest --allow-empty
