name: Деплой документации

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование кода
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настройка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Определение версии из manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "В manifest.json отсутствует корректное поле version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Используется версия: $VERSION"

      - name: Сборка документации
        run: mkdocs build -c

      - name: Деплой с mike
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ steps.version.outputs.version }}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
