name: Генерация изменений

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование кода
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Определение диапазона коммитов
        id: range
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          VERSION="${CURRENT_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -vxF "$CURRENT_TAG" | head -1 || true)

          if [[ -n "$PREV_TAG" ]]; then
            BASE_REF="$PREV_TAG"
          else
            BASE_REF=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi

          echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Диапазон: $BASE_REF..$CURRENT_TAG (версия $VERSION)"

      - name: Генерация секции changelog
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const version = '${{ steps.range.outputs.version }}';
            const base = '${{ steps.range.outputs.base }}';
            const head = '${{ steps.range.outputs.tag }}';
            const date = new Date().toISOString().split('T')[0];

            const log = execSync(
              `git log --pretty=format:%s ${base}..${head}`,
              { encoding: 'utf8' }
            ).trim();

            const subjects = log === '' ? [] : log.split('\n');

            const categories = {
              feat: '### Added',
              fix: '### Fixed',
              docs: '### Documentation',
              style: '### Style',
              refactor: '### Changed',
              test: '### Tests',
              chore: '### Maintenance',
              ci: '### CI',
              perf: '### Performance',
              build: '### Build',
              revert: '### Reverts'
            };

            const buckets = {};

            for (const firstLine of subjects) {
              const match = firstLine.match(/^(\w+)(?:\(([^)]+)\))?:\s*(.+)$/);
              let category;
              let text;
              if (match) {
                const [, type, scope, description] = match;
                category = categories[type] || '### Other';
                text = scope ? `**${scope}:** ${description}` : description;
              } else {
                category = '### Other';
                text = firstLine;
              }
              if (!buckets[category]) buckets[category] = [];
              buckets[category].push(`- ${text}`);
            }

            let section = `## [${version}] - ${date}\n\n`;
            section += `Автогенерация по коммитам \`${base}..${head}\`.\n\n`;

            for (const [category, items] of Object.entries(buckets)) {
              if (items.length === 0) continue;
              section += `${category}\n\n`;
              section += items.join('\n') + '\n\n';
            }

            section += `### Links\n\n`;
            section += `- [Compare](https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${base}...${head})\n`;
            section += `- [Documentation](https://devcraftclub.github.io/mhdocs/)\n`;
            section += `- [Readme DevCraft](https://readme.devcraft.club)\n`;

            fs.writeFileSync('changelog-section.md', section, 'utf8');
            console.log(section);

      - name: Коммит CHANGELOG.md в main
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Сохраняем секцию вне git tree, затем переключаемся на main
          cp changelog-section.md /tmp/changelog-section.md

          git fetch origin main
          git checkout -f -B main origin/main

          HEADER=$'# Журнал изменений\n\nФормат основан на [Keep a Changelog](https://keepachangelog.com/ru/1.0.0/).\n'
          SECTION=$(cat /tmp/changelog-section.md)

          if [[ -f CHANGELOG.md ]]; then
            # Убрать повторяющийся заголовок файла
            BODY=$(awk '
              BEGIN { skip=1 }
              skip && /^# Журнал изменений$/ { next }
              skip && /^Формат основан на / { next }
              skip && /^$/ { next }
              { skip=0; print }
            ' CHANGELOG.md)
            printf '%s\n%s\n%s\n' "$HEADER" "$SECTION" "$BODY" > CHANGELOG.md
          else
            printf '%s\n%s\n' "$HEADER" "$SECTION" > CHANGELOG.md
          fi

          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "docs: обновление журнала изменений для ${{ steps.range.outputs.tag }}"
            git push origin main
          fi

          cp /tmp/changelog-section.md changelog-section.md

      - name: Загрузка журнала изменений как артефакт
        uses: actions/upload-artifact@v7
        with:
          name: журнал-изменений-${{ github.ref_name }}
          path: |
            CHANGELOG.md
            changelog-section.md
          retention-days: 90
          if-no-files-found: warn
